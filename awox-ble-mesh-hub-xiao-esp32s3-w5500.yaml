# Example for the Seeed Studio XIAO W5500 Ethernet Adapter (XIAO ESP32-S3 Plus + WIZnet W5500, PoE)
# https://wiki.seeedstudio.com/xiao_w5500_ethernet_adapter/
#
# Same as awox-ble-mesh-hub.yaml, but the hub is connected with a cable instead of Wi-Fi.
# The board has no `wifi:` section here; BLE gets the whole 2.4 GHz radio.
esphome:
  name: awox-ble-mesh-hub
  friendly_name: "AwoX BLE mesh hub"
  name_add_mac_suffix: false
  min_version: 2025.12.0

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    # Be sure to "Clean Build Files" when switching framework
    type: esp-idf

# Enable logging
logger:
  #level: VERY_VERBOSE

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# W5500 SPI wiring of the XIAO W5500 Ethernet Adapter
ethernet:
  type: W5500
  clk_pin: GPIO7 # D8
  mosi_pin: GPIO9 # D10
  miso_pin: GPIO8 # D9
  cs_pin: GPIO2 # D1
  interrupt_pin: GPIO10 # D16 (INT wiring fixed in board revision V1.2)
  # reset_pin: not connected on this board

external_components:
  - source:
      type: git
      url: https://github.com/fsaris/EspHome-AwoX-BLE-mesh-hub
      ref: main
  #  ref: dev
  # - source:
  #     type: local
  #     path: components

esp32_ble_tracker:
  scan_parameters:
    active: false

awox_mesh:
  mesh_name: !secret mesh_name
  mesh_password: !secret mesh_password

  # See awox-ble-mesh-hub.yaml and the README for all optional options

  device_info:
    # Example device type, the 'product_id' is shown in the log for devices that are not configured yet
    - product_id: 0x32
      device_type: RGB
      manufacturer: EGLO
      name: Spot 120
      model: EGLOSpot 120/w
      icon: mdi:wall-sconce-flat

  # Mesh devices and groups to show in Home Assistant.
  # Devices and groups that are not listed here are written to the log, ready to copy.
  # devices:
  #   - mesh_id: 12345
  #     name: Kitchen spot
  #     type: RGB # RGB, WHITE_TEMP, DIM or PLUG

  # groups:
  #   - group_id: 3
  #     name: Living room
  #     type: RGB

  # Optional diagnostic sensors
  active_connections:
    name: Active connections
  online_devices:
    name: Online devices
  unconfigured_devices:
    name: Unconfigured mesh devices
  last_unconfigured_device:
    name: Last unconfigured device
