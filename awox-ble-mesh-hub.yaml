esphome:
  name: awox-ble-mesh-hub
  friendly_name: "AwoX BLE mesh hub"
  name_add_mac_suffix: false

esp32:
  # Match this with the board your using
  board: nodemcu-32s
  framework:
    # Be sure to "Clean Build Files" when switching framework
    type: esp-idf

status_led:
  # Match this with the board your using
  pin: GPIO2

# Enable logging
logger:
  #level: VERY_VERBOSE

# debug:
#   update_interval: 5s

# text_sensor:
#   - platform: debug
#     reset_reason:
#      name: "Reset Reason"

# sensor:
#   - platform: debug
#     free:
#       name: "Heap Free"
#     loop_time:
#       name: "Loop Time"

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/fsaris/EspHome-AwoX-BLE-mesh-hub
      ref: main
  #  ref: dev
  # - source:
  #     type: local
  #     path: components

esp32_ble_tracker:
  scan_parameters:
    active: false

awox_mesh:
  mesh_name: !secret mesh_name
  mesh_password: !secret mesh_password

  # Optional options

  # address_prefix: A4:C1
  # min_rssi: -90 # to prevent that the mesh tries to connect to devices that are out of range
  # max_connections: 2 # max 3 connections

  # You can give a list of mesh_ids that only should be handled by this device
  # Example when you want to setup multiple ESP modules to only control a part of the mesh) be sure to also set allowed_mac_addresses option.

  # allowed_mesh_ids:
  #   - 12345
  #   - 23456
  #   - 6758

  # You can give a list of mac_addresses that are allowed to connect to (to exclude some devices that are often offline or for the allowed_mesh_ids option)

  # allowed_mac_addresses:
  #   - A4:C1:38:8A:BA:11
  #   - A4:C1:38:65:AD:22

  # Mesh devices and groups to show in Home Assistant.
  # Devices and groups that are not listed here are written to the log, ready to copy.
  # Fill in the type from the product id, see the README or the helper page.
  devices:
    - mesh_id: 12345
      name: Kitchen spot
      type: RGB # RGB, WHITE_TEMP, DIM or PLUG
      icon: mdi:wall-sconce-flat # optional

  groups:
    - group_id: 3
      name: Living room
      type: RGB

  # Optional diagnostic sensors
  active_connections:
    name: Active connections
  online_devices:
    name: Online devices
  unconfigured_devices:
    name: Unconfigured mesh devices
  last_unconfigured_device:
    name: Last unconfigured device
